name: "*▶️ Integration Readiness"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: "integration-readiness-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('br-{0}', github.ref_name) }}"
  cancel-in-progress: true

jobs:
  standard-checks:
    name: Standard Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm shim
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && pnpm store prune

      - name: Check dead-code
        run: pnpm run check:deadcode

      - name: Check formatting (Including non-source files)
        run: pnpm run check:format

      - name: Run linter
        run: pnpm run check:lint

      - name: Run type checks
        run: pnpm run check:type

      - name: Run tests with coverage
        run: |
          set -Eeuo pipefail
          pnpm run check:test | tee /tmp/coverage-${{ github.run_id }}.txt

      - name: Report coverage to summary
        if: success()
        run: |
          set -Eeuo pipefail
          {
            echo "## Test Coverage Report"
            echo ""

            if [ -f /tmp/coverage-${{ github.run_id }}.txt ] && grep -q "Coverage report" /tmp/coverage-${{ github.run_id }}.txt; then
              echo '| File | % Stmts | % Branch | % Funcs | % Lines | Uncovered Line #s |'
              echo '|:-----|--------:|---------:|--------:|--------:|--------------------|'
              sed -n '/^File/{n;:loop;n;/^-/q;p;b loop;}' /tmp/coverage-${{ github.run_id }}.txt
            else
              echo '_Coverage data not available_'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f /tmp/coverage-${{ github.run_id }}.txt

      - name: Bundle action
        run: pnpm run bundle
